services:
  web:
    build: .
    container_name: thinking-fast-slow-web
    command: >
      sh -c "python manage.py migrate &&
      gunicorn book_project.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: book_project.settings
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

apiVersion: apps/v1
kind: Deployment
metadata:
  name: thinking-fast-slow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thinking-fast-slow
  template:
    metadata:
      labels:
        app: thinking-fast-slow
    spec:
      containers:
        - name: app
          image: thinking-fast-slow:latest
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: book_project.settings
          readinessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: thinking-fast-slow
spec:
  selector:
    app: thinking-fast-slow
  ports:
    - port: 80
      targetPort: 8000
  type: LoadBalancer
